$schema: "http://json-schema.org/draft-04/schema#"
description: Output file specification
type: object
properties:
  directory:
    description: >
      path to a directory where output files should be copied
    type: string
    format: uri
    default: ./results
  files:
    description: defines a single output file
    type: array
    items:
      type: object
      properties:
        name:
          description: descriptive name of the output file.
          type: string
        input:
          description: >
            path to the file that should be copied to the output directory.
            Snakemake wildcards referring to columns in `units` are allowed.
            An input path that is `null` means that snakemake will find a rule
            that will generate the output file at `output`, and not copy
            an already generated file.
          type:
            - string
            - "null"
          format: uri
        output:
          description: >
            relative path within the output directory where `inputfile` should
            be copied to. Snakemake wildcards referring to columns in `units`
            are allowed.
          type: string
          format: uri
        types:
          description: >
            unit types the file should be generated for. Defaults to ["N"].
          type: array
          items:
            type: string
        when:
          description: >
            optional condition that must hold for the file to be requested.
            Implemented in workflow/rules/results.smk. Currently supported:
            `complete_trio` - only for probands that have both parents in
            samples.tsv.
          type: string
          enum:
            - complete_trio
      required:
        - name
        - input
required:
  - directory
  - files
