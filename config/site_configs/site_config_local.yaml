---
# ---------------------------------------------------------------------------
#  Site-config - lokal korning och CI
#
#  Anvands som: --configfile config/site_configs/site_config_local.yaml
#               tillsammans med profiles/local och reference_files_local.yaml
# ---------------------------------------------------------------------------

PIPELINE_HOME: "."

# Lokalt containerbibliotek. Bygg med:
#   tools/build_containers.sh <pipeline> --dest ~/.cgu/containers
CONTAINER_DIR: "{{PIPELINE_HOME}}/.containers"

resources: "config/resources/resources_local.yaml"

# Lokala hydra-moduler. Peka pa en katalog med en klon per modul, med taggar:
#   hydra-genetics/{alignment,annotation,cnv_sv,...}
hydra_local_path: "{{PIPELINE_HOME}}/../../../shared/hydra-modules"
