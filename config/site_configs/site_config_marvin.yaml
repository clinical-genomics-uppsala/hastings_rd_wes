---
# ---------------------------------------------------------------------------
#  Site-config - Marvin
#
#  Anvands som: --configfile config/site_configs/site_config_marvin.yaml
#
#  Har bor allt som beror pa klustret men inte pa assayen: var hydra-modulerna
#  och containrarna ligger, vilken resursfil som galler. Referensfilernas
#  sokvagar ligger i config/reference_files/reference_files_marvin.yaml.
# ---------------------------------------------------------------------------

# Containerbiblioteket. Fylls av tools/build_containers.sh vid installation,
# enligt containers/manifest.yaml. Med explicita .sif-sokvagar i config
# anvands inte langre profilens singularity-prefix for dessa bilder.
CONTAINER_DIR: /projects/cgu/library/containers

resources: "config/resources/resources_marvin.yaml"

# Lokala hydra-genetics-moduler. Utan detta faller get_module_snakefile()
# tillbaka pa GithubFile och korningen kraver natverk. Klonerna maste ha de
# taggar som config["modules"] pekar pa - kontrolleras av assert_offline_ready.
hydra_local_path: /projects/bin/wp3_te/hastings_rd_wes_{{PIPELINE_VERSION}}/hydra-genetics

